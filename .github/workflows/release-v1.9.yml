name: Publish Android v1.9
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.9.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify and publish signed APK
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.9 >/dev/null 2>&1; then
            echo 'Release v1.9 is already published.'
            exit 0
          fi
          printf '%s\n' 'd9054db06d7170b12867ab013a94e63290d54547017e54ab9565e7fc5553264c  release/Ploshchadka-SPB-1.9.apk' '605ba6517f3385d19bc24a5b483fe5ba5d5dccb3dab7586f9098266a5300670a  release/Ploshchadka-SPB-1.9-Android.zip' | sha256sum -c
          gh release create v1.9 "release/Ploshchadka-SPB-1.9.apk" "release/Ploshchadka-SPB-1.9-Android.zip" \
            --target "$GITHUB_SHA" --title "Площадка СПб 1.9" --notes-file RELEASE_NOTES.md
